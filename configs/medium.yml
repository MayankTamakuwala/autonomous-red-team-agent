# 16 hosts, 192 actions.
scenario: external/PenGym/database/scenarios/medium.yml
seed: 0

# How long to train
total_steps: 500000
max_episode_steps: 2000

# Network and learning
hidden_size: 256
lr: 0.0005
gamma: 0.95

# Replay buffer
batch_size: 64
buffer_capacity: 100000
learning_starts: 10000
train_every: 1

# Target network
target_update: 2000

# Exploration (epsilon drops from start to end over eps_decay_steps)
eps_start: 1.0
eps_end: 0.05
eps_decay_steps: 250000

# Print a progress line every N episodes
log_every: 10
