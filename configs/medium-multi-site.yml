# Final-results scenario for later
scenario: external/PenGym/database/scenarios/medium-multi-site.yml
seed: 0

# How long to train
total_steps: 300000
max_episode_steps: 2000

# Network and learning
hidden_size: 256
lr: 0.0005
gamma: 0.99

# Replay buffer
batch_size: 64
buffer_capacity: 100000
learning_starts: 5000
train_every: 1

# Target network
target_update: 2000

# Exploration (epsilon drops from start to end over eps_decay_steps)
eps_start: 1.0
eps_end: 0.05
eps_decay_steps: 150000

# Print a progress line every N episodes
log_every: 10